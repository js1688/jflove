# JFLove Web 端 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# v1.5.0 反馈修复：新增后端反代。
#
# 背景：前端原先默认打**绝对地址**（如 http://localhost:8989，与页面不同源），
# 浏览器因此对每个请求都先发一条 `OPTIONS` CORS 预检 —— 服务端实际收到的
# HTTP 条数是业务调用的 2 倍（实测 OPTIONS 数 == 业务请求数，32 个场景全中），
# 用户感知就是「接口像被调了两遍」。
#
# 现在前端默认走**同源相对路径** `/api/...`（`DEFAULT_SERVER_URL = ''`），
# 由本文件把 `/api/` 与 `/health` 反代到后端，彻底消除预检。
#
# 上游地址默认 `jflove-server:8989`（同 docker network 下的服务名）。
# 用变量 + resolver 是刻意的：nginx 在**启动时**解析 proxy_pass 里的字面量主机名，
# 解析不到会直接启动失败 —— 单独起 web 容器（没有 jflove-server DNS）就起不来。
# 用变量则改为**按请求解析**，启动不会因上游缺失而失败。

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    set $jflove_server "jflove-server:8989";

    # ── 业务接口 ──
    location /api/ {
        proxy_pass http://$jflove_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件分片上传 / 流式下载：关闭缓冲，放宽超时
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
    }

    # ── 明文白名单探活接口 ──
    location = /health {
        proxy_pass http://$jflove_server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # index.html 禁止缓存（HTML 入口变化时确保浏览器加载最新 JS/CSS）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA fallback：所有非静态文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（JS/CSS 文件名带 hash，可安全缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
