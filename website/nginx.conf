# JFLove 官网 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 官网是**纯静态站点**：
#   - 不反代任何后端接口（官网自己不调产品 API，只展示文档）
#   - 只有一条 SPA fallback（React Router 的深链需要它）
#   - 静态资源长缓存，index.html 不缓存

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：/guide/web 这类深链直接访问时回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁止缓存（入口变化时确保浏览器拿到最新 JS/CSS）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 截图等图片：中等缓存（版本升级后文件名不变，故不用 immutable）
    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(?:png|svg|ico|webp|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # gzip（静态文本收益明显）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
