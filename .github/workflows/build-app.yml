name: Build Android APK

# 移动端线上构建：debug + release 两个 APK，作为 workflow artifact 下载。
# 版本号单一来源：仓库根 version.json（pubspec.yaml 由 sync_version.py 同步，versionCode 从版本号派生）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 校验 tag 与 version.json 一致，并校验 pubspec.yaml 的版本号（含派生 versionCode）
      - name: 提取并校验版本号
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag 版本 ${TAG_VERSION} 与 version.json 的 ${VERSION} 不一致"
              exit 1
            fi
          fi
          python scripts/sync_version.py --check
          echo "构建版本：$VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # R8 禁令（发布阻塞项）：release 的 isMinifyEnabled / isShrinkResources 必须为 false
      - name: R8 禁令检查
        run: |
          if grep -nE "isMinifyEnabled[[:space:]]*=[[:space:]]*true|isShrinkResources[[:space:]]*=[[:space:]]*true" jflove-app/android/app/build.gradle.kts; then
            echo "::error::检测到 release 启用了 R8 混淆/压缩，阻断发布"
            exit 1
          fi
          echo "R8 关闭检查通过"

      - name: flutter pub get
        run: cd jflove-app && flutter pub get

      - name: Build debug APK
        run: cd jflove-app && flutter build apk --debug

      - name: Build release APK
        run: cd jflove-app && flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jflove-app-apks
          path: |
            jflove-app/build/app/outputs/flutter-apk/app-debug.apk
            jflove-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
