name: CI Guards (库结构核对 / 工具可信性)

# 为什么单独一条 workflow：
#   AGENTS.md §5.1.1 把「代码 ↔ dev ↔ prod 表结构核对」定为**发布阻塞项**，
#   devops 技能的发布步骤里也要求执行，但此前 5 个构建 workflow 里**一次都没跑过** ——
#   v1.5.0 就是这么漏的：dev 库陈旧（users.username 还带列级 UNIQUE）、没人拦。
#
# 本 workflow 只做三件事，都是秒级、纯本地校验，不构建任何产物：
#   ① 按**当前代码**在现场生成一份等价 dev 库（`init_db()`）—— 见下"为什么不用仓库里的 dev 库"；
#   ② `scripts/verify_check_db_schema.py` —— 核对**工具自身**可信（喂坏数据必须拦住、
#      喂纯格式差异必须放行）。工具不可信时先修工具，别拿它当门禁（LESSONS.md L16/L17）；
#   ③ `scripts/check_db_schema.py` —— 「代码 ↔ prod」结构核对。
#
# 为什么不用仓库里的 dev 库：
#   dev 库是**开发数据、不入库**（.gitignore 明确排除 `jflove-db/jflove-dev.db`），
#   模块 venv（`jflove-server/venv-linux/`）同样不入库 ⇒ CI 干净检出里两个都**不存在**。
#   所以这里先用当前代码现场建一份等价 dev，再把它**显式传参**给 ② 和 ③ 当基准。
#
# ⚠ v1.5.0 CI 复盘（本次修的就是它）：
#   ② 原先写作裸调用 `python scripts/verify_check_db_schema.py`，而那个脚本当时的运行
#   前提是**开发机约定**（仓库里的真 dev 库 + 模块 venv）且**不接受任何参数** ⇒
#   CI 上立刻 `[FATAL] 缺少必要文件：<repo>/jflove-db/jflove-dev.db` 退 2，整条 workflow 红。
#   教训：**门禁脚本的运行前提必须可声明、可注入**（`--dev` / `--prod` / `--tool-python`），
#   不能只有"开发机默认值"这一种形态；调用方也要按脚本的**真实前提**接线，
#   而不是照着注释里那句"dev 库不入库"想当然。
#
# ⚠ 关卡①（代码 → dev）需要 `aiosqlite`：缺依赖时脚本会**非 0 退出**（不再是静默跳过），
#   所以下面的 pip install 不是可选项。

# 触发时机：**只在真实发布（打 tag）时跑**，或手动触发。
# 为什么不在 push main / PR 上跑：这套核对与「发布前强制关卡」是同一件事
# （AGENTS.md §7.3 Phase 8 第 3 步），每次提交都跑属于重复调用、噪音大。
# 需要临时验证时用 workflow_dispatch 手动跑一次即可。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  db-schema-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 关卡① 要 import jflove-server 的建表 DDL；依赖链只用到 aiosqlite
      # （src/config/settings.py 与 src/utils/logger.py 都是标准库）。
      - name: 安装关卡①依赖
        run: python -m pip install --upgrade pip aiosqlite

      # 必须在 ② 之前生成：② 的反向验证需要一个"真 dev"当基线（CI 里只有这份现场生成的）。
      - name: ① 按当前代码建一份等价 dev 库（dev 库不入库，故现场生成）
        env:
          TMP_DEV_DB: ${{ runner.temp }}/ci-dev.db
        run: |
          python - <<'PY'
          import asyncio, os, sys
          sys.path.insert(0, "jflove-server")
          # 必须在 import src.models.database 之前改 settings.DB_PATH ——
          # database.py 是模块级 `from src.config.settings import DB_PATH`（值绑定），
          # 先 import 再改就晚了（同 run_server.py 的 JFLOVE_DB_PATH 做法）。
          from src.config import settings
          settings.DB_PATH = os.path.abspath(os.environ["TMP_DEV_DB"])
          from src.models.database import init_db
          asyncio.run(init_db())
          print("已按当前代码建好临时 dev 库：", settings.DB_PATH)
          PY

      - name: ② 工具可信性（坏数据必须拦住、纯格式差异必须放行）
        env:
          # 指定一个「没装 aiosqlite」的解释器，让脚本能覆盖「缺依赖 ⇒ 必须失败」这组断言
          # （脚本自身会探测；这里显式给出更稳；不存在时脚本会自行 SKIP）
          JFLOVE_BARE_PYTHON: /usr/bin/python3
        run: |
          # --dev         : 用 ① 现场生成的等价 dev 当基准（仓库里没有 dev 库）
          # --prod        : 仓库里入库的生产库
          # --tool-python : 跑 check_db_schema.py 的解释器，**必须装了 aiosqlite**。
          #                 模块 venv 不入库，CI 里就是 setup-python 这个解释器。
          python scripts/verify_check_db_schema.py \
            --dev "${{ runner.temp }}/ci-dev.db" \
            --prod jflove-db/jflove-prod.db \
            --tool-python "$(python -c 'import sys; print(sys.executable)')"

      - name: ③ 代码 ↔ prod 表结构核对（发布阻塞项，退出码非 0 即阻塞发布）
        run: |
          python scripts/check_db_schema.py \
            --dev "${{ runner.temp }}/ci-dev.db" \
            --prod jflove-db/jflove-prod.db

  cross-end-consistency-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 两个门禁都是**纯标准库、零第三方依赖**，所以这里不需要 pip install。
      # 它们守的是"跨端一致性"这类**肉眼看不出来**的漂移：
      #   ① 品牌资产：两端 public/logo-* 必须同字节，且源码引用的资产两端都得有；
      #   ② 同源快照：两端同源文件（如笔记页、组件样式表）必须逐字节一致 —— v1.5.1 之前
      #      只能靠"人工比一次 sha256"，本 job 把它变成退出码判据。
      # 依据：LESSONS.md L12（约束要绑定到可执行的检查）、L17（门禁自身必须有反向验证）。

      - name: ① 品牌资产跨端一致性（两端 logo 同字节 + 源码引用反查）
        run: python scripts/check_logo_sync.py

      - name: ①b 门禁可信性：坏数据必须被拦住（反向验证）
        run: python scripts/check_logo_sync.py --self-test

      - name: ② 同源快照一致性（两端同源文件逐字节）
        run: python scripts/check_web_desktop_parity.py

      - name: ②b 门禁可信性：篡改/缺文件/清单腐烂必须被拦住（反向验证）
        run: python scripts/check_web_desktop_parity.py --self-test
