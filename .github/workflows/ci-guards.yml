name: CI Guards (库结构核对 / 工具可信性)

# 为什么单独一条 workflow：
#   AGENTS.md §5.1.1 把「代码 ↔ dev ↔ prod 表结构核对」定为**发布阻塞项**，
#   devops 技能的发布步骤里也要求执行，但此前 5 个构建 workflow 里**一次都没跑过** ——
#   v1.5.0 就是这么漏的：dev 库陈旧（users.username 还带列级 UNIQUE）、没人拦。
#
# 本 workflow 只做两件事，都是秒级、纯本地校验，不构建任何产物：
#   ① `scripts/verify_check_db_schema.py` —— 核对**工具自身**可信（喂坏数据必须拦住、
#      喂纯格式差异必须放行）。工具不可信时先修工具，别拿它当门禁（LESSONS.md L16/L17）。
#   ② `scripts/check_db_schema.py` —— 「代码 ↔ prod」结构核对。
#
# 为什么不用仓库里的 dev 库：
#   dev 库是**开发数据、不入库**（.gitignore 明确排除 `jflove-db/jflove-dev.db`），
#   所以这里先用**当前代码**在现场建一份等价 dev（`init_db()`），再拿它当基准去比 prod。
#   这样 CI 拦的正是要紧的事：prod 缺了代码要求的表 / 列 / 索引。
#
# ⚠ 关卡①（代码 → dev）需要 `aiosqlite`：缺依赖时脚本会**非 0 退出**（不再是静默跳过），
#   所以下面的 pip install 不是可选项。

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  db-schema-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # 关卡① 要 import jflove-server 的建表 DDL；依赖链只用到 aiosqlite
      # （src/config/settings.py 与 src/utils/logger.py 都是标准库）。
      - name: 安装关卡①依赖
        run: python -m pip install --upgrade pip aiosqlite

      - name: ① 工具可信性（坏数据必须拦住、纯格式差异必须放行）
        env:
          # 指定一个「没装 aiosqlite」的解释器，让脚本能覆盖「缺依赖 ⇒ 必须失败」这组断言
          # （脚本自身会探测；这里显式给出更稳；不存在时脚本会自行 SKIP）
          JFLOVE_BARE_PYTHON: /usr/bin/python3
        run: python scripts/verify_check_db_schema.py

      - name: ② 按当前代码建一份等价 dev 库（dev 库不入库，故现场生成）
        env:
          TMP_DEV_DB: ${{ runner.temp }}/ci-dev.db
        run: |
          python - <<'PY'
          import asyncio, os, sys
          sys.path.insert(0, "jflove-server")
          # 必须在 import src.models.database 之前改 settings.DB_PATH ——
          # database.py 是模块级 `from src.config.settings import DB_PATH`（值绑定），
          # 先 import 再改就晚了（同 run_server.py 的 JFLOVE_DB_PATH 做法）。
          from src.config import settings
          settings.DB_PATH = os.path.abspath(os.environ["TMP_DEV_DB"])
          from src.models.database import init_db
          asyncio.run(init_db())
          print("已按当前代码建好临时 dev 库：", settings.DB_PATH)
          PY

      - name: ③ 代码 ↔ prod 表结构核对（发布阻塞项，退出码非 0 即阻塞发布）
        run: |
          python scripts/check_db_schema.py \
            --dev "${{ runner.temp }}/ci-dev.db" \
            --prod jflove-db/jflove-prod.db
