name: Build Desktop (PyInstaller)

# 桌面端线上构建：复用本地 build.py（版本一致性校验 + secret 扫描 + PyInstaller onefile）。
# PyInstaller 必须在目标 OS 上各自构建，故用 matrix 并行跑 Linux + Windows（macOS 仍走本地）。
# 版本号单一来源：仓库根 version.json；打 tag 时校验 tag 与 version.json 一致。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: jflove-desktop-linux
          - os: windows-latest
            artifact_name: jflove-desktop-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 提取并校验版本号
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag 版本 ${TAG_VERSION} 与 version.json 的 ${VERSION} 不一致"
              exit 1
            fi
          fi
          python scripts/sync_version.py --check
          echo "构建版本：$VERSION"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python deps
        run: |
          cd jflove-desktop
          pip install -r requirements.txt

      # 复用本地构建脚本（内部再次校验 desktop 模块版本号 + secret 扫描）
      - name: Build（复用 build.py）
        run: |
          cd jflove-desktop
          python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: jflove-desktop/build/dist/
          if-no-files-found: error

      - name: 上传产物到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          draft: true
          files: jflove-desktop/build/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
