name: Build Desktop (PyInstaller onedir + 安装包)

# 桌面端线上构建：复用各模块 build.py（版本一致性校验 + secret 扫描 + Mermaid 资源门禁）。
#
# 产物形态（v1.5.0 起，由 plans/desktop-packaging-onedir-installer-rpm-v1.5.0.md 定稿）：
#   · Windows job：onedir 目录 → Inno Setup 安装包 JFLove-<ver>-win64-setup.exe + 便携 zip
#   · Linux job（Fedora 容器）：onedir 目录 → RPM jflove-desktop-<ver>-1.fc<N>.x86_64.rpm
# 为什么不再用 onefile 单文件：onefile 每次启动都要把数百 MB（含 QtWebEngine）解压到
#   %TEMP%\_MEIxxxx，实测「启动→首窗可见」中位 9.58s；onedir 直接映射文件，中位 1.31s（快 ~7.3×）。
#
# PyInstaller **不能交叉编译** ⇒ Windows 与 Linux 必须各自构建，故分两个 job。
#
# ⚠ 构建前必须先生成 Mermaid 离线包：`jflove-desktop/resources/mermaid/` 是**生成物**
#   （未被 git 跟踪，见 scripts/build_mermaid_bundle.mjs），而 build.py 有
#   `assert_mermaid_assets()` 硬门禁 —— 少了这一步构建会直接失败（这是本次补掉的既有缺口）。
#
# 版本号单一来源：仓库根 version.json；打 tag 时校验 tag 与 version.json 一致。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node（生成 Mermaid 离线包用）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成 Mermaid 离线渲染包（三端共用）
        shell: bash
        run: |
          cd jflove-web
          npm ci
          node ../scripts/build_mermaid_bundle.mjs

      - name: 提取并校验版本号
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag 版本 ${TAG_VERSION} 与 version.json 的 ${VERSION} 不一致"
              exit 1
            fi
          fi
          python scripts/sync_version.py --check
          echo "构建版本：$VERSION"

      - name: 安装 Inno Setup（产出 setup.exe；缺失时 build.py 只降级出 zip）
        run: choco install innosetup --no-progress -y

      - name: Install Python deps
        run: |
          cd jflove-desktop
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build（onedir + Inno 安装包 + 便携 zip）
        run: |
          cd jflove-desktop
          python build.py --mode onedir --installer --zip

      # 只上传**产物文件**，不上传 onedir 目录（3671 个文件 / 670MB，整目录上传既臃肿又难下载）
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jflove-desktop-windows
          path: |
            jflove-desktop/build/dist/*setup.exe
            jflove-desktop/build/dist/*portable.zip
          if-no-files-found: error

      - name: 上传产物到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          draft: true
          files: |
            jflove-desktop/build/dist/*setup.exe
            jflove-desktop/build/dist/*portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-rpm:
    runs-on: ubuntu-latest
    # RPM 必须在 Fedora 环境构建：%{?dist} 标签正确、glibc 基线明确（本机 Windows 无法交叉编译）
    container:
      image: fedora:43
    steps:
      # fedora 基础镜像不含 git，actions/checkout 会失败，必须先装
      - name: 安装构建依赖（git / nodejs / python3 / rpm-build）
        run: dnf install -y git nodejs npm python3 python3-pip findutils rpm-build

      - name: Checkout
        uses: actions/checkout@v4

      - name: 生成 Mermaid 离线渲染包（三端共用）
        run: |
          cd jflove-web
          npm ci
          node ../scripts/build_mermaid_bundle.mjs

      - name: 提取并校验版本号
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::tag 版本 ${TAG_VERSION} 与 version.json 的 ${VERSION} 不一致"
              exit 1
            fi
          fi
          python3 scripts/sync_version.py --check
          echo "构建版本：$VERSION"

      # 脚本内部：建 venv 装 PyInstaller 依赖 → 跑模块 build.py --mode onedir（复用全部安全门禁）
      #            → 按 FHS 布局 → rpmbuild。已在 Fedora 容器内，故不加 --container。
      - name: Build RPM
        run: sh jflove-desktop/packaging/linux/build_rpm.sh --fedora 43

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jflove-desktop-linux-rpm
          path: jflove-desktop/build/dist/*.rpm
          if-no-files-found: error

      - name: 上传产物到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          draft: true
          files: jflove-desktop/build/dist/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
