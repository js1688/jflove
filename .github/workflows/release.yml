name: Create Release

# 打 tag 时自动创建 Draft Release，正文写清楚 GHCR 拉取/运行命令 + 各端产物下载说明。
# 正文模板在 .github/release-body-template.md，由本 workflow 读 version.json 后 sed 替换占位符生成；
# desktop/app 构建完成后会把产物追加为 release Assets（不碰正文）；server/web 镜像推 GHCR。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 提取版本号
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json', encoding='utf-8'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 生成 Release 正文
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed "s/__VERSION__/${VERSION}/g; s/__OWNER__/${OWNER}/g" \
            .github/release-body-template.md > release_body.md
          echo "===== release_body.md 内容 ====="
          cat release_body.md

      - name: 创建 Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: ${{ github.workspace }}/release_body.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
