name: jflove_app
description: "JFLove 移动端 App - 私有文档与笔记协同管理"
publish_to: 'none'
version: 1.5.0+1005000

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  pointycastle: ^4.0.0
  path_provider: ^2.1.6
  x25519: ^0.1.1
  flutter_markdown: ^0.7.6
  video_player: ^2.13.0
  logging: ^1.2.0
  file_picker: ^10.0.0
  webview_flutter: ^4.14.1
  markdown: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # v1.5.0：Mermaid 离线渲染资源
  #   renderer.html      —— 本地渲染页（零网络依赖，模板内联 bundle）
  #   mermaid.bundle.js  —— 自包含 IIFE，由仓库根
  #                         scripts/build_mermaid_bundle.mjs 生成，三端共用同一份产物
  assets:
    - assets/mermaid/
